<script>
(function () {
  const K = window.WEB_KONFIG || { merek: 'SANFELO', merekPanjang: 'SANFELO LIVING', ketAdj: true, catatan: '' };
  // keterangan adjustment pembayaran PIUTANG (SL: aktif sejak Nov 2026, hutang SL belum)
  const KET_ADJ_PIUTANG = K.ketAdjPiutang === undefined ? K.ketAdj : K.ketAdjPiutang;
  document.title = K.merek + ' Admin';
  document.querySelectorAll('.merek-nama').forEach(function (el) { el.textContent = K.merek; });
  document.querySelectorAll('.merek-huruf').forEach(function (el) { el.textContent = K.merek.charAt(0); });
  document.querySelectorAll('.merek-panjang').forEach(function (el) { el.textContent = K.merekPanjang; });
  const S = { token: null, nama: '', hal: 'dashboard', data: { sheet: 'TRANSAKSI', halaman: 1 }, pb: null, mode: {}, daftar: {}, revisi: null };
  const $ = function (id) { return document.getElementById(id); };
  const JUDUL = {
    dashboard: ['RINGKASAN', 'Dashboard'], po: ['POSTING', 'PO Masuk'], sj: ['POSTING', 'Surat Jalan & Invoice'], tt: ['POSTING', 'Tanda Terima Barang'], biaya: ['POSTING', 'Biaya Tambah & Invoice Palet'], spr: ['POSTING', 'SJ & Invoice Sparepart'], kas: ['POSTING', 'Petty Cash & Buku Bank'], laporan: ['LIHAT', 'Laporan Invoice'], cetak: ['LIHAT', 'Cetak Nota (PDF)'], pok: ['POSTING', 'PO Keluar'], alat: ['LIHAT', 'Alat & Perbaikan'], stok: ['LIHAT', 'Stok Barang'], piutang: ['POSTING', 'Pembayaran Piutang'], hutang: ['POSTING', 'Bayar Hutang'],
    invoice: ['LIHAT', 'Detail Invoice'], produk: ['DATA MASTER', 'Produk'], customer: ['DATA MASTER', 'Customer'], alat: ['SISTEM', 'Alat & Perbaikan'], aktivitas: ['SISTEM', 'Aktivitas Admin']
  };
  const SHEETS = ['DISKON', 'DATA_BERSIH', 'TRANSAKSI', 'DETAIL_TRANSAKSI', 'PENJUALAN', 'HUTANG', 'PEMBELIAN', 'HISTORY_PO_MASUK', 'HISTORY_PO_KELUAR', 'TEMPO TOKO', 'SPAREPART', 'EKSPEDISI', 'LOG_INVOICE_CETAK'];

  /* ---------- bantuan ---------- */
  function esc(v) { return String(v === null || v === undefined ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function rp(n) { n = Number(n) || 0; return (n < 0 ? '-Rp' : 'Rp') + Math.abs(Math.round(n)).toLocaleString('id-ID'); }
  function hariIniIso() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }
  // sesi login disimpan di browser ini (localStorage) supaya buka tab baru / refresh tidak perlu login & memuat ulang.
  // Sesi tetap habis sendiri di server setelah 6 jam tidak dipakai.
  function simpan(k, v) { try { if (v === null) { localStorage.removeItem(k); sessionStorage.removeItem(k); } else localStorage.setItem(k, v); } catch (e) { } }
  function ambil(k) { try { return localStorage.getItem(k) || sessionStorage.getItem(k); } catch (e) { return null; } }
  // tanggal default = hari ini. Isian yang masih berisi tanggal default lama (tab dibuka sejak kemarin)
  // ikut diganti ke hari ini; tanggal yang diubah sendiri oleh admin tidak disentuh.
  function isiHariIni(id, paksa) {
    const el = $(id); if (!el) return;
    const v = el.type === 'month' ? hariIniIso().slice(0, 7) : hariIniIso();
    if (paksa || !el.value || el.value === el.dataset.def) el.value = v;
    el.dataset.def = v;
  }
  function segarkanTanggal() {
    document.querySelectorAll('input[data-def]').forEach(function (el) { if (el.id) isiHariIni(el.id); });
    if ($('tglHariIni')) $('tglHariIni').textContent = new Date().toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }
  document.addEventListener('visibilitychange', function () { if (!document.hidden) segarkanTanggal(); });
  window.addEventListener('focus', segarkanTanggal);
  function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('tampil'); clearTimeout(toast._t); toast._t = setTimeout(function () { el.classList.remove('tampil'); }, 3500); }
  // penanda memuat kecil di atas (tidak menutup layar). Dihitung bertumpuk: hilang setelah SEMUA permintaan selesai.
  let MEMUAT = 0;
  function memuat(on, teks) {
    MEMUAT = Math.max(0, MEMUAT + (on ? 1 : -1));
    if (on) $('memuatTeks').textContent = teks || 'Memuat…';
    $('garisMuat').classList.toggle('tersembunyi', MEMUAT === 0);
    // teks kecil di pojok hanya kalau memuat lebih dari 1,5 detik
    clearTimeout(memuat._t);
    if (MEMUAT === 0) $('memuat').classList.add('tersembunyi');
    else memuat._t = setTimeout(function () { if (MEMUAT > 0) $('memuat').classList.remove('tersembunyi'); }, 1500);
  }
  function lencanaStatus(s) {
    const u = String(s || '').toUpperCase();
    const kelas = u === 'LUNAS' || u === 'DONE' || u === 'TERCETAK' ? 'hijau' : (u === 'LOCKED' || u === 'BATAL' ? 'merah' : (u ? 'kuning' : ''));
    return u ? '<span class="lencana ' + kelas + '">' + esc(u) + '</span>' : '';
  }
  // angka di input boleh pakai titik ribuan: "1.250.000"
  function tglTampil(iso) { const p = String(iso || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso; }
  function angkaInput(v) { return Number(String(v || '').replace(/[^\d]/g, '')) || 0; }

  // ---- PERCEPAT: hasil baca yang berat disimpan sementara di browser (detik) ----
  // Setiap simpan/ubah/hapus dari web langsung mengosongkan simpanan ini, jadi data sesudah simpan selalu baru.
  const CACHE_TTL = { dashboard: 120, masterPO: 600, masterTT: 300, stok: 300, tempoTokoDaftar: 300, daftarPOTerbuka: 120, bulanHutang: 900, daftarPalet: 300, laporan: 300, groupingDaftar: 300,
    daftarPiutang: 60, daftarKas: 60, daftarData: 60, logWeb: 30, daftarAdmin: 600, semuaData: 120 };
  // LANCAR: data TAMPILAN (hanya dilihat) langsung tampil dari simpanan terakhir walau sudah lama/basi,
  // lalu diambil ulang di latar dan layar diperbarui sendiri bila ada yang berubah.
  // Data untuk FORM (PO, SJ, TT, hutang, ...) tidak pernah dipakai dalam keadaan basi: sesudah ada perubahan
  // simpanannya dibuang dan disiapkan ulang di latar, jadi form selalu memakai data terbaru.
  const CACHE_LIHAT = ['dashboard', 'stok', 'laporan', 'daftarPiutang', 'daftarKas', 'daftarData', 'logWeb', 'daftarAdmin', 'semuaData'];
  const AKSI_BACA = ['dashboard', 'daftarData', 'daftarPiutang', 'cariInvoice', 'supplierHutang', 'daftarPBHutang', 'bulanHutang', 'detailInvoice', 'logWeb', 'masterPO', 'hitungPO',
    'daftarPOTerbuka', 'muatPOSJ', 'pratinjauSJ', 'masterTT', 'muatPOKeluarTT', 'hitungTT', 'invoiceUntukBiaya', 'daftarPalet', 'detailPalet', 'pratinjauSparepart', 'stok', 'daftarKas',
    'laporan', 'tempoTokoDaftar', 'susulanKandidat', 'statusSJ', 'groupingDaftar', 'poKeluarMuat', 'poKeluarDariPOMasuk', 'bukaSJ', 'bukaTT', 'bukaSpr', 'siapkanLatihan', 'daftarAdmin', 'versiData', 'cekHutang', 'bukaPO', 'semuaData', 'dokumen'];
  let CACHE = {};
  let SEDANG = {}; // permintaan baca yang sedang berjalan (tidak dikirim dua kali)
  let GEN = 0; // naik setiap simpanan dibuang/ditandai basi: hasil baca yang berangkat sebelumnya tidak dianggap baru
  function kosongkanCache() { CACHE = {}; SEDANG = {}; GEN++; }
  function sibuk(el, on) {
    if (!el) return;
    const n = Math.max(0, (Number(el.dataset.sibuk) || 0) + (on ? 1 : -1));
    el.dataset.sibuk = n; el.classList.toggle('sibuk', n > 0);
  }
  // ada perubahan data: tampilan disimpan sebagai "basi" (tetap bisa langsung tampil), data form dibuang
  function tandaiBasi() {
    Object.keys(CACHE).forEach(function (k) {
      if (CACHE_LIHAT.indexOf(k.split('|')[0]) !== -1) CACHE[k].basi = true; else delete CACHE[k];
    });
    SEDANG = {}; GEN++;
  }
  // halaman yang aman digambar ulang otomatis (hanya menampilkan data, tidak ada isian yang bisa hilang)
  const TAMPIL_ULANG = {
    dashboard: function () { muatDashboard(); }, piutang: function () { muatPiutang(); }, kas: function () { muatKas(); },
    laporan: function () { muatLaporan(); }, stok: function () { muatStok(true); }, aktivitas: function () { muatLog(); },
    po: function () { muatDaftarHal('po'); }, sj: function () { muatDaftarHal('sj'); }, tt: function () { muatDaftarHal('tt'); }, spr: function () { muatDaftarHal('spr'); },
    pok: function () { muatDaftarHal('pok'); }, produk: function () { muatDaftarHal('produk'); }, customer: function () { muatDaftarHal('customer'); }
  };
  function jadwalTampilUlang() {
    clearTimeout(jadwalTampilUlang._t);
    jadwalTampilUlang._t = setTimeout(function () {
      if (!S.token || !TAMPIL_ULANG[S.hal]) return;
      if (!$('latarModal').classList.contains('tersembunyi')) return; // ada dialog terbuka: jangan diganggu
      TAMPIL_ULANG[S.hal]();
    }, 250);
  }
  // ambil ulang 1 data tampilan di latar; layar diperbarui hanya kalau isinya berubah
  function ambilLatar(aksi, args, kunci) {
    if (SEDANG[kunci]) return;
    const lama = CACHE[kunci] && CACHE[kunci].v;
    api(aksi, args, null, { diam: true, paksa: true }).then(function () {
      if (CACHE[kunci] && CACHE[kunci].v !== lama) jadwalTampilUlang();
    }).catch(function () { });
  }
  function kunciCache(aksi, args) { return aksi + '|' + JSON.stringify(args || {}); }
  function segarAktif() { return S.segarSampai && Date.now() < S.segarSampai; }

  function api(aksi, args, teks, opsi) {
    opsi = opsi || {};
    // mode latihan: pastikan file latihan (salinan database) sudah siap sebelum aksi pertama
    if (S.latihan && !S.latihanSiap && aksi !== 'siapkanLatihan' && S.token) {
      return siapkanLatihan(false).then(function () { return api(aksi, args, teks, opsi); });
    }
    const ttl = !S.latihan && CACHE_TTL[aksi];
    const kunci = ttl ? kunciCache(aksi, args) : '';
    const tulis = AKSI_BACA.indexOf(aksi) === -1;
    if (tulis && S.menulis) return Promise.reject(new Error('Masih menyimpan data sebelumnya, tunggu sebentar.'));
    // data tampilan yang sudah basi: langsung tampil, ambil ulang di latar
    if (ttl && !opsi.paksa && !segarAktif() && CACHE[kunci] && CACHE_LIHAT.indexOf(aksi) !== -1 &&
      (CACHE[kunci].basi || Date.now() - CACHE[kunci].t >= ttl * 1000)) {
      ambilLatar(aksi, args, kunci);
      return Promise.resolve(JSON.parse(CACHE[kunci].v));
    }
    if (ttl && !opsi.paksa && !segarAktif() && CACHE[kunci] && !CACHE[kunci].basi && Date.now() - CACHE[kunci].t < ttl * 1000) {
      return Promise.resolve(JSON.parse(CACHE[kunci].v));
    }
    if (ttl && SEDANG[kunci]) {
      if (!opsi.diam) memuat(true, teks);
      return SEDANG[kunci].then(function (v) { if (!opsi.diam) memuat(false); return JSON.parse(JSON.stringify(v)); },
        function (e) { if (!opsi.diam) memuat(false); throw e; });
    }
    const kirim = Object.assign({}, args || {}, { latihan: S.latihan });
    if (tulis && S.revisi && S.revisi.aksi.indexOf(aksi) !== -1) kirim.alasanRevisi = S.revisi.alasan; // REVISI_NOTA
    if (ttl && segarAktif()) kirim.segar = true;
    const genAwal = GEN;
    if (!opsi.diam) memuat(true, teks);
    // selama memuat/menyimpan, hanya halaman ini yang dikunci (supaya tidak ada isian/klik yang memakai
    // data setengah jadi); menu samping & halaman lain tetap bisa dibuka
    const halSibuk = (tulis || !opsi.diam) ? $('hal-' + S.hal) : null;
    sibuk(halSibuk, true);
    if (tulis) S.menulis = true;
    let sudah = false;
    const selesaiTulis = function () {
      if (sudah) return; sudah = true;
      sibuk(halSibuk, false);
      if (!tulis) return;
      S.menulis = false;
      tandaiBasi(); jadwalSiapkanUlang();
    };
    const janji = new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(function (res) {
          if (!opsi.diam) memuat(false);
          selesaiTulis(); // ada yang (mungkin) ditulis -> simpanan form dibuang, tampilan ditandai basi
          if (res && res.ok) {
            if (tulis) setelahSimpanNota(aksi, res.data);
            if (ttl) {
              try {
                // dibaca sebelum ada perubahan: tampilan disimpan sebagai basi, data form tidak disimpan
                if (genAwal === GEN) CACHE[kunci] = { t: Date.now(), v: JSON.stringify(res.data) };
                else if (CACHE_LIHAT.indexOf(aksi) !== -1) CACHE[kunci] = { t: Date.now(), v: JSON.stringify(res.data), basi: true };
              } catch (e) { }
            }
            if (S.latihan && res.latihan && res.latihan.length) { S.catatLatihan = res.latihan; toast('🧪 Latihan: tersimpan di file latihan, bukan data asli'); }
            return resolve(res.data);
          }
          if (res && res.sesiHabis) { keluar(true); return reject(new Error('Sesi habis, silakan masuk lagi.')); }
          const pesan = (res && res.pesan) || 'Terjadi kesalahan.';
          // fungsi spreadsheet meminta konfirmasi (YA/TIDAK): tanyakan ke admin, ulangi dengan jawaban YA
          if (pesan.indexOf('KONFIRMASI|') === 0 && !(args && args.jawabYa)) {
            return konfirmasi('Konfirmasi', '<p style="white-space:pre-wrap">' + esc(pesan.slice(11)) + '</p>', 'Ya, lanjutkan').then(function (ya) {
              if (!ya) return reject(new Error('Dibatalkan.'));
              api(aksi, Object.assign({}, args || {}, { jawabYa: true }), teks).then(resolve, reject);
            });
          }
          reject(new Error(pesan.replace(/^ISIAN\|/, 'Perlu isian: ')));
        })
        .withFailureHandler(function (err) {
          if (!opsi.diam) memuat(false);
          selesaiTulis(); // bisa saja sebagian sudah tersimpan
          reject(new Error(err && err.message ? err.message : 'Koneksi ke server gagal. Coba lagi.'));
        })
        .webApi(S.token, aksi, kirim);
    });
    if (ttl) {
      SEDANG[kunci] = janji;
      const lepas = function () { if (SEDANG[kunci] === janji) delete SEDANG[kunci]; };
      janji.then(lepas, lepas);
    }
    return janji;
  }
  function gagal(err) { toast(err.message || String(err)); }

  // hitung ulang di latar (pratinjau PO / SJ / TT): tanpa layar memuat, dan hanya SATU permintaan
  // berjalan per form -- ketikan berikutnya menunggu lalu dihitung sekali dengan isian terbaru
  const JALAN = {};
  function satuJalan(nama, fn) {
    const j = JALAN[nama] || (JALAN[nama] = {});
    if (j.jalan) { j.lagi = true; return; }
    j.jalan = true;
    Promise.resolve().then(fn).catch(function () { }).then(function () {
      j.jalan = false;
      if (j.lagi) { j.lagi = false; satuJalan(nama, fn); }
    });
  }
  function apiLatar(aksi, args) { return api(aksi, args, null, { diam: true }); }

  // setelah login: siapkan data form yang sering dipakai di latar, supaya PO / SJ / TT langsung terbuka
  function siapkanDiLatar() {
    if (S.latihan || S.sudahSiapLatar) return;
    S.sudahSiapLatar = true;
    siapkanAntre(true);
  }
  // semua=true: sesudah login (form + tampilan). false: sesudah ada perubahan (data form saja,
  // tampilan diambil ulang saat dibuka / oleh jadwalTampilUlang)
  function siapkanAntre(semua) {
    if (S.latihan || !S.token) return;
    const ada = function (f) { return !K.fitur || K.fitur.indexOf(f) !== -1; };
    const antre = [];
    if (ada('sj')) antre.push(['daftarPOTerbuka', { cari: '' }]);
    if (ada('po')) antre.push(['masterPO', {}]);
    if (ada('tt')) antre.push(['masterTT', {}]);
    antre.push(['bulanHutang', {}]);
    if (semua) {
      antre.push(['daftarPiutang', { cari: '' }]);
      if (ada('kas')) antre.push(['daftarKas', { sheet: KAS.sheet, bulan: hariIniIso().slice(0, 7) }]);
      if (ada('stok')) antre.push(['stok', {}]);
      if (ada('laporan')) antre.push(['laporan', { bulan: '' }]);
      if (ada('biaya')) antre.push(['daftarPalet', {}]);
      if (ada('alat')) antre.push(['tempoTokoDaftar', {}]);
      if (ada('po')) antre.push(['semuaData', { sheet: 'HISTORY_PO_MASUK' }]);
      if (ada('sj')) antre.push(['semuaData', { sheet: 'TRANSAKSI' }]);
    }
    (function berikut() {
      const x = antre.shift(); if (!x || !S.token || S.latihan) return;
      apiLatar(x[0], x[1]).catch(function () { }).then(berikut);
    })();
  }
  function jadwalSiapkanUlang() {
    clearTimeout(jadwalSiapkanUlang._t);
    jadwalSiapkanUlang._t = setTimeout(function () { siapkanAntre(false); }, 2500);
  }

  // PANTAU: cek ringan ke server tiap 45 detik (hanya saat tab terlihat). Kalau ada data baru
  // (disimpan admin lain / baris baru di spreadsheet), tampilan diperbarui sendiri.
  const PANTAU_MS = 45000;
  function cekVersi() {
    if (!S.token || S.latihan || document.hidden || S.menulis || S.cekVersiJalan) return;
    S.cekVersiJalan = true;
    apiLatar('versiData', {}).then(function (d) {
      const v = d && d.v;
      if (!v) return;
      if (S.versi && v !== S.versi) adaDataBaru();
      S.versi = v;
    }).catch(function () { }).then(function () { S.cekVersiJalan = false; });
  }
  function adaDataBaru() {
    tandaiBasi();
    if (S.hal !== 'po') PO.master = null;
    if (S.hal !== 'tt') TT.master = null;
    if (S.hal !== 'stok') STOK.data = null;
    jadwalTampilUlang();
    jadwalSiapkanUlang();
  }
  setInterval(cekVersi, PANTAU_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) cekVersi(); });

  /* ---------- modal ---------- */
  function bukaModal(judul, html) {
    if (S.latihan && String(judul).indexOf('✅') === 0) {
      judul = '🧪 LATIHAN — ' + String(judul).replace(/^✅\s*/, '');
      html = '<div class="peringatan">Mode latihan: disimpan di FILE LATIHAN (salinan database), data asli tidak berubah. Nota bisa dicoba dicetak.</div>' + html;
    } $('modalJudul').textContent = judul; $('modalIsi').innerHTML = html; $('latarModal').classList.remove('tersembunyi'); }
  function tutupModal() { $('latarModal').classList.add('tersembunyi'); $('modalIsi').innerHTML = ''; }
  $('tutupModal').onclick = tutupModal;
  $('latarModal').addEventListener('click', function (e) { if (e.target === $('latarModal')) tutupModal(); });
  function konfirmasi(judul, html, teksYa) {
    return new Promise(function (resolve) {
      bukaModal(judul, html + '<div class="aksi-bawah"><button class="tombol" id="kBatal">Batal</button><button class="tombol utama" id="kYa">' + esc(teksYa || 'Ya, simpan') + '</button></div>');
      $('kBatal').onclick = function () { tutupModal(); resolve(false); };
      $('kYa').onclick = function () {
        S.pilihanModal = {};
        document.querySelectorAll('#modalIsi .sprHpp').forEach(function (sel) { S.pilihanModal[sel.dataset.k] = Number(sel.value); });
        tutupModal(); resolve(true);
      };
    });
  }

  // cegah angka berubah karena scroll mouse di atas kolom angka
  document.addEventListener('wheel', function (e) { if (e.target && e.target.type === 'number' && document.activeElement === e.target) e.target.blur(); }, { passive: true });

  /* ---------- login ---------- */
  $('formLogin').addEventListener('submit', function (e) {
    e.preventDefault();
    $('loginPesan').textContent = '';
    $('tombolLogin').disabled = true;
    google.script.run
      .withSuccessHandler(function (res) {
        $('tombolLogin').disabled = false;
        if (!res.ok) { $('loginPesan').textContent = res.pesan; return; }
        S.token = res.token; S.nama = res.nama;
        simpan('sfToken', res.token); simpan('sfNama', res.nama); simpan('sfNamaTerakhir', res.nama);
        setLatihan(res.nama === 'ADMIN' && $('loginLatihan').checked);
        masuk();
      })
      .withFailureHandler(function (err) { $('tombolLogin').disabled = false; $('loginPesan').textContent = err.message; })
      .webLogin($('loginNama').value, $('loginPin').value);
  });
  // daftar nama akun (klik nama, lalu isi PIN)
  function muatNamaLogin() {
    google.script.run.withSuccessHandler(function (list) {
      if (!list || !list.length) return;
      $('loginNamaBungkus').classList.add('tersembunyi');
      $('loginPilihNama').innerHTML = list.map(function (n) { return '<button type="button" data-nama="' + esc(n) + '">' + esc(n) + '</button>'; }).join('');
      pilihNamaLogin(ambil('sfNamaTerakhir') && list.indexOf(ambil('sfNamaTerakhir')) !== -1 ? ambil('sfNamaTerakhir') : list[0]);
    }).withFailureHandler(function () { }).webNamaAdmin();
  }
  function pilihNamaLogin(n) {
    $('loginNama').value = n;
    $('loginPilihNama').querySelectorAll('button').forEach(function (b) { b.classList.toggle('aktif', b.dataset.nama === n); });
    const bisaLatihan = n === 'ADMIN' && (!K.fitur || K.fitur.indexOf('latihan') !== -1);
    $('loginLatihanBungkus').classList.toggle('tersembunyi', !bisaLatihan);
    if (!bisaLatihan) $('loginLatihan').checked = false;
    $('loginPesan').textContent = '';
    setTimeout(function () { $('loginPin').focus(); }, 0);
  }
  $('loginPilihNama').addEventListener('click', function (e) { const b = e.target.closest('[data-nama]'); if (b) pilihNamaLogin(b.dataset.nama); });
  muatNamaLogin();
  function masuk() {
    $('layarLogin').classList.add('tersembunyi');
    $('aplikasi').classList.remove('tersembunyi');
    $('namaAdmin').textContent = S.nama; $('sapaAdmin').textContent = S.nama;

  function riwayatHtml(list, bisaUbah) {

  /* ---------- cek tanggal bayar (dipakai saat posting & saat ubah riwayat) ---------- */
  function tglIsoKeDate(iso) { const m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }
  function tglPanjang(d) { return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
  function tglTeksKeIso(t) { const m = String(t || '').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m ? m[3] + '-' + ('0' + m[2]).slice(-2) + '-' + ('0' + m[1]).slice(-2) : ''; }
  function cekTanggalBayar(iso) {
    const d = tglIsoKeDate(iso);
    const n = new Date();
    const hariIni = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    if (!d) return { error: 'Tanggal bayar belum diisi / tidak valid.', list: [] };
    if (d > hariIni) return { error: 'Tanggal bayar tidak boleh setelah hari ini (' + tglPanjang(hariIni) + ').', list: [] };
    const w = [];
    if (d.getFullYear() !== hariIni.getFullYear() || d.getMonth() !== hariIni.getMonth()) {
      w.push('BULAN/TAHUN berbeda dengan bulan ini (' + hariIni.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }) + '). Pastikan memang ' + d.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' }) + '.');
    } else if (d.getTime() !== hariIni.getTime()) {
      w.push('Tanggal BUKAN hari ini (hari ini ' + tglPanjang(hariIni) + ').');
    }
    return { error: '', list: w, d: d };
  }

  /* ---------- ubah tanggal / keterangan adjustment riwayat yang sudah diposting ---------- */
  function bukaUbahRiwayat(d, i) {
    const r = d.riwayatPembayaran[i];
    if (!r) return;
    const adj = r.metode === 'ADJUSTMENT';
    const html = '<div class="grid-info">' +
      '<div class="info"><small>No Post</small><b>' + esc(r.noPost || '-') + '</b></div>' +
      '<div class="info"><small>Tanggal sekarang</small><b>' + esc(r.tanggal) + '</b></div>' +
      '<div class="info"><small>Jumlah · Metode</small><b>' + rp(r.jumlah) + ' · ' + esc(r.metode) + (adj ? ' (' + esc(r.keterangan || 'tanpa keterangan') + ')' : '') + '</b></div>' +
      '</div><div class="form-grid">' +
      '<label>Tanggal bayar yang benar<input type="date" id="uTgl" value="' + esc(tglTeksKeIso(r.tanggal)) + '"></label>' +
      (adj && KET_ADJ_PIUTANG ? '<label>Keterangan adjustment<input id="uKet" maxlength="60" value="' + esc(r.keterangan || '') + '" placeholder="mis. pembulatan, biaya admin"></label>' : '') +
      '<label class="penuh">Alasan diubah (wajib)<input id="uAlasan" maxlength="100" placeholder="mis. salah klik bulan / lupa isi keterangan"></label>' +
      '</div><p class="kecil" style="color:#7a6a5a;font-size:12px">Hanya tanggal' + (adj && KET_ADJ_PIUTANG ? ' dan keterangan' : '') + ' yang bisa diubah. Nominal, metode, sisa & status tidak berubah. Perubahan tercatat di sheet LOG_EDIT_PEMBAYARAN.</p>' +
      '<div id="uPesan"></div><div class="aksi-bawah"><button class="tombol" id="uBatal">Kembali</button><button class="tombol utama" id="uSimpan">Simpan perubahan</button></div>';
    bukaModal('✏️ Ubah riwayat ' + d.noInvoice, html);
    $('uBatal').onclick = function () { tampilPembayaran(d); };
    $('uSimpan').onclick = function () {
      const salah = function (t) { $('uPesan').innerHTML = '<div class="gagal">' + esc(t) + '</div>'; };
      const tgl = $('uTgl').value;
      const tglBerubah = !!tgl && tgl !== tglTeksKeIso(r.tanggal);
      const ket = $('uKet') ? $('uKet').value.trim() : '';
      const ketBerubah = !!$('uKet') && ket !== (r.keterangan || '');
      const alasan = $('uAlasan').value.trim();
      if (!tglBerubah && !ketBerubah) return salah('Belum ada yang diubah.');
      let peringatan = [];
      if (tglBerubah) {
        const c = cekTanggalBayar(tgl);
        if (c.error) return salah(c.error);
        peringatan = c.list;
      }
      if (ketBerubah && ket.length < 3) return salah('Keterangan adjustment minimal 3 huruf (mis. pembulatan, biaya admin, sparepart).');
      if (alasan.length < 3) return salah('Isi alasan perubahan.');
      const ringkas = '<p>Ubah riwayat <b>' + esc(r.noPost || ('ke-' + (i + 1))) + '</b> invoice <b>' + esc(d.noInvoice) + '</b>:</p><ul>' +
        (tglBerubah ? '<li>Tanggal: ' + esc(r.tanggal) + ' → <b>' + esc(tglPanjang(tglIsoKeDate(tgl))) + '</b></li>' : '') +
        (ketBerubah ? '<li>Keterangan: ' + esc(r.keterangan || '(kosong)') + ' → <b>' + esc(ket) + '</b></li>' : '') +
        '<li>Alasan: ' + esc(alasan) + '</li></ul>' +
        peringatan.map(function (t) { return '<div class="peringatan">⚠️ ' + esc(t) + '</div>'; }).join('');
      konfirmasi('Konfirmasi ubah riwayat', ringkas, 'Ya, ubah').then(function (ya) {
        if (!ya) { bukaUbahRiwayat(d, i); return; }
        api('ubahRiwayatBayar', {
          noInvoice: d.noInvoice, urutan: i, noPost: r.noPost || '', tanggalLama: r.tanggal, jumlahLama: r.jumlah,
          tglBaru: tglBerubah ? tgl : '', keteranganBaru: ketBerubah ? ket : '', alasan: alasan
        }, 'Menyimpan perubahan…').then(function (h) {
          if (!h.success) { tampilPembayaran(d, '<div class="gagal">' + esc(h.message) + '</div>'); return; }
          tampilPembayaran(h, '<div class="sukses">' + esc(h.pesan || 'Riwayat pembayaran diubah.') + '</div>');
          toast('Riwayat ' + d.noInvoice + ' diubah');
          if (S.hal === 'piutang') muatPiutang();
        }).catch(function (err) { tampilPembayaran(d, '<div class="gagal">' + esc(err.message) + '</div>'); });
      });
    };
  }

  function simpanPembayaran(d, tetap) {
    const jumlah = angkaInput($('pJumlah').value);
    const metode = $('pMetode').value;
    const ket = $('pKet').value;
    const tgl = $('pTgl').value;
    if (!jumlah) { $('pPesan').innerHTML = '<div class="gagal">Jumlah bayar belum diisi.</div>'; return; }
    const cekTgl = cekTanggalBayar(tgl);
    if (cekTgl.error) { $('pPesan').innerHTML = '<div class="gagal">' + esc(cekTgl.error) + '</div>'; return; }
    if (metode === 'ADJUSTMENT' && KET_ADJ_PIUTANG && ket.trim().length < 3) { $('pPesan').innerHTML = '<div class="gagal">Metode Adjustment wajib diisi keterangannya (mis. pembulatan, biaya admin, sparepart).</div>'; $('pKet').focus(); return; }
    // ⬅️ cek ulang sebelum posting: tanggal lengkap dengan nama hari + peringatan + centang wajib
    const peringatan = cekTgl.list.slice();
    if (jumlah > d.sisaTagihan) peringatan.push('Jumlah MELEBIHI sisa tagihan (' + rp(d.sisaTagihan) + '). Akan tercatat LEBIH ' + rp(jumlah - d.sisaTagihan) + '.');
    const ringkas = '<p>Cek ulang pembayaran <b>' + esc(d.noInvoice) + '</b> (' + esc(d.namaToko) + ') sebelum diposting:</p>' +
      peringatan.map(function (t) { return '<div class="gagal">⚠️ ' + esc(t) + '</div>'; }).join('') +
      '<div class="grid-info"><div class="info"><small>Tanggal</small><b>' + esc(tglPanjang(cekTgl.d)) + '</b></div><div class="info"><small>Jumlah</small><b>' + rp(jumlah) + '</b></div><div class="info"><small>Metode</small><b>' + esc(metode) + (metode === 'ADJUSTMENT' && KET_ADJ_PIUTANG ? ' (' + esc(ket) + ')' : '') + '</b></div></div>' +
      '<label style="display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-size:13px"><input type="checkbox" id="kCek" style="width:auto;margin-top:2px"><span>Saya sudah mencocokkan <b>tanggal, bulan, nominal dan metode</b> dengan bukti bayar.</span></label>';
    const lanjut = tetap ? Promise.resolve(true) : konfirmasi('⚠️ Cek ulang sebelum posting', ringkas, 'Ya, posting');
    if (!tetap) { $('kYa').disabled = true; $('kCek').onchange = function () { $('kYa').disabled = !this.checked; }; }
    lanjut.then(function (ya) {
      if (!ya) { tampilPembayaran(d); return; }
      api('bayarPiutang', { noInvoice: d.noInvoice, jumlahBayar: jumlah, metodeBayar: metode, keteranganAdjustment: ket, tglBayar: tgl, tetapSimpan: !!tetap }, 'Menyimpan pembayaran…').then(function (h) {
        if (h.perluKonfirmasi) {
          konfirmasi('Pembayaran sudah pernah dicatat', '<div class="peringatan">' + esc(h.message) + '</div>', 'Ya, catat lagi').then(function (ya2) {
            if (!ya2) { tampilPembayaran(d); return; }
            tampilPembayaran(d);
            $('pTgl').value = tgl; $('pJumlah').value = jumlah.toLocaleString('id-ID'); $('pMetode').value = metode; $('pKet').value = ket;
            simpanPembayaran(d, true);
          });
          return;
        }
        if (!h.success) { tampilPembayaran(d, '<div class="gagal">' + esc(h.message) + '</div>'); return; }
        const catatan = (h.catatan || []).length ? '<div class="peringatan">' + esc(h.catatan.join(' · ')) + '</div>' : '';
        tampilPembayaran(h, '<div class="sukses">Tersimpan ' + esc(h.noPost || '') + '. Status: ' + esc(h.status) + '.</div>' + catatan);
        toast('Pembayaran ' + d.noInvoice + ' tersimpan');
        if (S.hal === 'piutang') muatPiutang();
      }).catch(function (err) { tampilPembayaran(d, '<div class="gagal">' + esc(err.message) + '</div>'); });
    });
  }

  /* ---------- hutang ---------- */
  // segar = true dari tombol 🔄 Segarkan: muat ulang bulan, pemeriksaan, dan tabel PB yang sedang tampil
  function muatBulanHutang(segar) {
    if ($('hutangBulan').options.length && !segar) return;
    const bulanLama = $('hutangBulan').value, supplierLama = $('hutangSupplier').value;
    const adaTabel = !!(S.pb && S.pb.success && $('areaPB').innerHTML);
    api('bulanHutang', {}, 'Memuat bulan…').then(function (list) {
      $('hutangBulan').innerHTML = list.map(function (b) { return '<option>' + esc(b) + '</option>'; }).join('');
      if (bulanLama && list.indexOf(bulanLama) !== -1) $('hutangBulan').value = bulanLama;
      cekHutang();
      if (!list.length) { $('areaPB').innerHTML = '<div class="kartu"><div class="kosong">Belum ada data hutang dengan BULAN atau TGL BELI yang terbaca.</div></div>'; return; }
      muatSupplier(segar ? supplierLama : '', segar && adaTabel);
    }).catch(gagal);
  }

  // pemeriksaan HUTANG: tgl beli tak terbaca, baris dobel (NO PB tidak ada di PEMBELIAN), sisa > total

      S.cekHutang = c;
      const bag = [];
      if (c.yatim.length) {
        bag.push('<p><b>Baris dobel / NO PB tidak ada di PEMBELIAN (' + c.yatim.length + ')</b></p>' + tabel(['Baris', 'PB', 'SJ', 'Supplier', 'Tgl beli', 'Total', 'Status', 'Kemungkinan baris yang benar', ''], c.yatim.map(function (h, i) {
          const k = h.kandidat[0];
          return { sel: [h.baris, '<b>' + esc(h.pb) + '</b>', esc(h.noSJ), esc(h.supplier), esc(h.tglBeli), rp(h.total), esc(h.status || '-') + (h.riwayat.length ? '<br><small class="redup">' + esc(h.riwayat.join(' ; ')) + '</small>' : ''),
            k ? esc(k.pb) + ' (baris ' + k.baris + ', SJ ' + esc(k.noSJ) + ')' + (h.kandidat.length > 1 ? ' +' + (h.kandidat.length - 1) : '') : '<span class="redup">-</span>',
            S.nama === 'ADMIN' ? '<button class="tombol" type="button" data-hutang-yatim="' + i + '">🗑 Hapus</button>' : ''] };
        }), [5]) + (S.nama === 'ADMIN' ? '' : '<p class="redup">Hanya akun ADMIN yang bisa menghapus baris ini.</p>'));
      }

        bag.push('<p><b>TGL BELI tidak terbaca / tahunnya salah (' + c.tanpaBulan.length + ')</b> — perbaiki tanggalnya di sheet PEMBELIAN (lalu HUTANG kolom F) dengan format tanggal yang benar.</p>' +
          tabel(['Baris HUTANG', 'PB', 'SJ', 'Supplier', 'Tgl beli tertulis', 'Sisa'], c.tanpaBulan.map(function (h) { return { sel: [h.baris, esc(h.pb), esc(h.noSJ), esc(h.supplier), '<b>' + esc(h.tglBeli || '(kosong)') + '</b>', rp(h.sisa)] }; }), [5]));

          tabel(['Baris HUTANG', 'PB', 'Supplier', 'Total', 'Sisa'], c.sisaAneh.map(function (h) { return { sel: [h.baris, esc(h.pb), esc(h.supplier), rp(h.total), '<b>' + rp(h.sisa) + '</b>'] }; }), [3, 4]));
      }
      $('cekHutang').innerHTML = bag.length ? '<div class="kartu"><div class="peringatan">⚠ Pemeriksaan data HUTANG</div>' + bag.join('') + '</div>' : '';

  $('cekHutang').addEventListener('click', function (e) {
    const b = e.target.closest('[data-hutang-yatim]');

      '<p class="redup">NO PB ini tidak ada di PEMBELIAN, jadi baris ini tidak akan dibuat ulang setelah dihapus.</p>' +

        '<label>Pindahkan pembayaran ke<select id="yatimTujuan">' + pilihan + '<option value="">— jangan pindahkan (pembayaran ikut terhapus) —</option></select></label>' : '') +

  function muatSupplier(supplierLama, tampilLagi) {
    const b = $('hutangBulan').value;
    if (!b) return;
    api('supplierHutang', { bulan: b }, 'Memuat supplier…').then(function (h) {
      $('hutangSupplier').innerHTML = h.list.length ? h.list.map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('') : '<option value="">Tidak ada supplier</option>';
      $('areaPB').innerHTML = '';
      if (typeof supplierLama === 'string' && supplierLama && h.list.indexOf(supplierLama) !== -1) {
        $('hutangSupplier').value = supplierLama;
        if (tampilLagi === true) muatPB();
      }
    }).catch(gagal);
  }
  $('hutangBulan').onchange = function () { muatSupplier(); };
  $('tombolMuatPB').onclick = muatPB;
  function muatPB(pesan) {
    const b = $('hutangBulan').value, s = $('hutangSupplier').value;
    if (!b || !s) { toast('Pilih bulan & supplier dulu.'); return; }
    api('daftarPBHutang', { bulan: b, supplier: s }, 'Memuat PB…').then(function (h) { tampilPB(h, typeof pesan === 'string' ? pesan : ''); }).catch(gagal);

  function tampilPB(h, pesan) {
    S.pb = h;
    if (!h.success) { $('areaPB').innerHTML = '<div class="kartu"><div class="kosong">' + esc(h.message) + '</div></div>'; return; }
    const baris = h.daftarPB.map(function (p, i) {
      const bisa = p.sisaBayar > 0;
      return '<tr class="pb-baris"><td>' + (bisa ? '<input type="checkbox" data-i="' + i + '" class="pbCek" style="width:auto">' : '') + '</td><td><b>' + esc(p.pb) + '</b><br><small class="redup">' + esc(p.noInv) + ' · SJ ' + esc(p.noSJ) + '</small></td><td>' + esc(p.tglBeli) + '</td><td>' + esc(p.jatuhTempo) + '</td><td class="kanan">' + rp(p.total) + '</td><td class="kanan"><b>' + (p.isLebih ? 'LEBIH' : rp(p.sisaBayar)) + '</b></td><td>' + lencanaStatus(p.status) + '</td><td>' + (bisa ? '<input data-j="' + i + '" class="pbJumlah" inputmode="numeric" value="' + Math.round(p.sisaBayar).toLocaleString('id-ID') + '" disabled>' : '') + '</td></tr>';
    }).join('');

      '<div class="kartu"><div class="tabel-bungkus"><table><thead><tr><th></th><th>PB</th><th>Tgl beli</th><th>Jatuh tempo</th><th class="kanan">Total</th><th class="kanan">Sisa</th><th>Status</th><th>Jumlah bayar</th></tr></thead><tbody>' + baris + '</tbody></table></div>' +
      '<div class="form-grid"><label>Tanggal bayar<input type="date" id="hTgl" value="' + hariIniIso() + '"></label><label>Metode<select id="hMetode"><option>TRANSFER</option><option>TUNAI</option><option>ADJUSTMENT</option></select></label>' +
      '<label id="hKetBungkus" class="tersembunyi penuh">Keterangan adjustment<input id="hKet" maxlength="60" placeholder="mis. pembulatan, biaya admin"></label></div>' +
      '<div class="peringatan" id="hInfo">Centang PB yang dibayar. Kalau lebih dari 1 PB dicentang, masing-masing dibayar penuh sesuai sisanya (sama seperti di spreadsheet). Untuk cicilan, centang 1 PB saja lalu ubah jumlahnya.</div>' +
      '<div class="aksi-bawah"><b id="hTotal" style="align-self:center">Dipilih: Rp0</b><button class="tombol utama" id="hBayar" disabled>Bayar</button></div></div>';
    $('hMetode').onchange = function () { $('hKetBungkus').classList.toggle('tersembunyi', !K.ketAdj || this.value !== 'ADJUSTMENT'); };
    document.querySelectorAll('.pbCek').forEach(function (c) { c.onchange = segarkanPilihanPB; });
    document.querySelectorAll('.pbJumlah').forEach(function (inp) { inp.addEventListener('input', function () { const n = angkaInput(this.value); this.value = n ? n.toLocaleString('id-ID') : ''; segarkanPilihanPB(); }); });
    $('hBayar').onclick = bayarPB;
  }
  function pilihanPB() {
    const dipilih = [];
    document.querySelectorAll('.pbCek').forEach(function (c) { if (c.checked) dipilih.push(Number(c.dataset.i)); });
    return dipilih;
  }
  function segarkanPilihanPB() {
    const dipilih = pilihanPB();
    document.querySelectorAll('.pbJumlah').forEach(function (inp) {
      const i = Number(inp.dataset.j);
      const satu = dipilih.length === 1 && dipilih[0] === i;
      inp.disabled = !satu;
      if (!satu) inp.value = Math.round(S.pb.daftarPB[i].sisaBayar).toLocaleString('id-ID');
    });
    const total = dipilih.reduce(function (s, i) { return s + angkaInput(document.querySelector('.pbJumlah[data-j="' + i + '"]').value); }, 0);
    $('hTotal').textContent = 'Dipilih: ' + dipilih.length + ' PB · ' + rp(total);
    $('hBayar').disabled = !dipilih.length;
  }
  function bayarPB() {
    const h = S.pb;
    const dipilih = pilihanPB();
    const payments = dipilih.map(function (i) {
      const p = h.daftarPB[i];
      return { rowIndex: p.rowIndex, pb: p.pb, jumlahBayar: angkaInput(document.querySelector('.pbJumlah[data-j="' + i + '"]').value) };
    });
    if (payments.some(function (p) { return !p.jumlahBayar; })) { toast('Jumlah bayar belum diisi.'); return; }
    const metode = $('hMetode').value, ket = $('hKet').value, tgl = $('hTgl').value;
    const total = payments.reduce(function (s, p) { return s + p.jumlahBayar; }, 0);
    konfirmasi('Konfirmasi bayar hutang', '<p><b>' + esc(h.supplier) + '</b> · bulan ' + esc(h.bulan) + ' · ' + esc(tglTampil(tgl)) + ' · ' + esc(metode) + (metode === 'ADJUSTMENT' && K.ketAdj ? ' (' + esc(ket) + ')' : '') + '</p>' +
      tabel(['PB', 'Jumlah'], payments.map(function (p) { return { sel: [esc(p.pb), rp(p.jumlahBayar)] }; }), [1]) + '<p style="text-align:right"><b>Total ' + rp(total) + '</b></p>').then(function (ya) {
      if (!ya) return;
      api('bayarHutang', { bulan: h.bulan, supplier: h.supplier, tglBayar: tgl, metodeBayar: metode, keteranganAdjustment: ket, payments: payments }, 'Menyimpan pembayaran hutang…').then(function (r) {
        if (!r.success) { tampilPB(h, '<div class="gagal">' + esc(r.message) + '</div>'); return; }
        const catatan = (r.catatan || []).length ? '<div class="peringatan">' + esc(r.catatan.join(' · ')) + '</div>' : '';
        tampilPB(r, '<div class="sukses">' + r.jumlahPBDibayar + ' PB tersimpan.' + (r.pbBaruLunas.length ? ' LUNAS: ' + esc(r.pbBaruLunas.join(', ')) : '') + '</div>' + catatan);
        toast('Pembayaran hutang tersimpan');
      }).catch(function (err) { tampilPB(h, '<div class="gagal">' + esc(err.message) + '</div>'); });
    });
  }

  /* ---------- daftar nota / data master ---------- */
  // ringkasan per customer = kolom G:H (CUSTOMER / PEMBELIAN) di TEMPO TOKO inventory
  function muatRingkasanTempo() {
    api('tempoTokoDaftar', {}, null).then(function (d) {
      if (!$('ringTempo')) return;
      const n = { LOCKED: 0, UNLOCKED: 0, lain: 0 };
      d.toko.forEach(function (t) { if (t.status === 'LOCKED') n.LOCKED++; else if (t.status === 'UNLOCKED') n.UNLOCKED++; else n.lain++; });
      const filter = S.ringFilter || 'semua';
      const tampil = d.toko.filter(function (t) {
        return filter === 'semua' || (filter === 'lain' ? t.status !== 'LOCKED' && t.status !== 'UNLOCKED' : t.status === filter);
      });
      const tombol = function (k, label, jml) { return '<button class="tombol kecil' + (filter === k ? ' gelap' : '') + '" data-ring="' + k + '" type="button">' + label + ' (' + jml + ')</button>'; };
      $('ringTempo').innerHTML = '<div class="kartu-kepala" style="margin-bottom:8px"><h4>Ringkasan customer (sama dengan kolom CUSTOMER / PEMBELIAN di inventory)</h4></div>' +
        '<div class="aksi-bawah" style="justify-content:flex-start;margin:0 0 8px">' + tombol('semua', 'Semua', d.toko.length) + tombol('LOCKED', 'LOCKED', n.LOCKED) + tombol('lain', 'Mendekati batas', n.lain) + tombol('UNLOCKED', 'UNLOCKED', n.UNLOCKED) + '</div>' +
        '<div style="max-height:360px;overflow:auto">' + tabel(['Customer', 'Pembelian', 'Invoice LOCKED', ''], tampil.map(function (t) {
          return { sel: [esc(t.customer), lencanaStatus(t.status), esc(t.invoice.map(function (i) { return i.noInv + ' (tempo ' + i.tempo + ')'; }).join(', ')),
            t.status === 'LOCKED' && S.nama === 'ADMIN' ? '<button class="tombol kecil" data-perpanjang="' + esc(t.customer) + '" type="button">🔓 Perpanjang</button>' : ''] };
        })) + '</div>' +
        '<p class="redup">Mendekati batas = sudah lewat tempo tapi masih dalam masa tenggang; angka HARI sama dengan yang tampil di inventory.</p>';
      $('ringTempo').querySelectorAll('[data-ring]').forEach(function (b) { b.onclick = function () { S.ringFilter = b.dataset.ring; muatRingkasanTempo(); }; });
      $('ringTempo').querySelectorAll('[data-perpanjang]').forEach(function (b) {
        b.onclick = function () { PT.pilih = b.dataset.perpanjang; pergi('alat'); if (PT.toko.length) muatTempoToko(); setTimeout(function () { $('kartuTempo').scrollIntoView({ behavior: 'smooth' }); $('ptHari').focus(); }, 300); };
      });
    }).catch(function (e) { if ($('ringTempo')) $('ringTempo').innerHTML = '<div class="gagal">' + esc(e.message || String(e)) + '</div>'; });
  }

      gambarPOK();
    }).catch(gagal);
  };
  $('pokTarik').onclick = function () {
    if (!POK.poNo) { toast('Muat tanggal PO keluar dulu.'); return; }
    const no = $('pokPOMasuk').value.trim(); if (!no) return;
    api('poKeluarDariPOMasuk', { poNo: no }, 'Mengambil barang PO masuk…').then(function (list) { POK.baris = POK.baris.concat(list); gambarPOK(); toast(list.length + ' barang ditambahkan'); }).catch(gagal);
  };
  $('pokTambah').onclick = function () { if (!POK.poNo) { toast('Muat tanggal PO keluar dulu.'); return; } POK.baris.push({ toko: '', barang: '', jumlah: 1, keterangan: '', nilaiF: '' }); gambarPOK(); };
  $('pokSimpan').onclick = function () {
    if (!POK.poNo) { toast('Muat tanggal PO keluar dulu.'); return; }
    konfirmasi('Simpan PO keluar ' + POK.poNo, '<p>' + POK.baris.length + ' barang. Isi PO ' + esc(POK.poNo) + ' di HISTORY_PO_KELUAR akan diganti dengan daftar ini (QTY TERKIRIM lama dipertahankan).</p>', 'Ya, simpan').then(function (ya) {
      if (!ya) return;
      api('poKeluarSimpan', { tgl: $('pokTgl').value, poNo: POK.poNo, items: POK.baris }, 'Menyimpan PO keluar…').then(function (h) {
        $('pokPesan').innerHTML = '<div class="sukses">PO ' + esc(h.poNo) + ' tersimpan (' + h.barang + ' barang).</div>' + ((h.catatan || []).length ? '<div class="peringatan">' + esc(h.catatan.join(' · ')) + '</div>' : '');
      }).catch(function (err) { $('pokPesan').innerHTML = '<div class="gagal">' + esc(err.message) + '</div>'; });
    });
  };
  $('pokCetak').onclick = function () { if (!POK.poNo) { toast('Muat tanggal PO keluar dulu.'); return; } cetakPdf('POK', POK.poNo); };

  /* ---------- alat & perbaikan ---------- */
  document.addEventListener('click', function (e) {
    const t = e.target.closest('[data-alat]'); if (!t) return;
    konfirmasi('Jalankan ' + t.textContent.trim() + '?', '<p>Sama dengan menu di spreadsheet inventory. Perubahan langsung tersimpan.</p>', 'Ya, jalankan').then(function (ya) {
      if (!ya) return;
      api('alat', { alat: t.dataset.alat }, 'Menjalankan…').then(function (h) {
        bukaModal('Hasil: ' + t.textContent.trim(), h.pesan.map(function (p) { return '<div class="sukses" style="white-space:pre-wrap">' + esc(p) + '</div>'; }).join(''));
      }).catch(gagal);
    });
  });
  const PT = { toko: [] };
  function tglTambah(iso, hari) { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + hari); return ('0' + d.getDate()).slice(-2) + '/' + ('0' + (d.getMonth() + 1)).slice(-2) + '/' + d.getFullYear(); }
  function gambarPratinjauTempo() {
    const t = PT.toko.filter(function (x) { return x.customer === $('ptToko').value; })[0];
    const hari = parseInt($('ptHari').value, 10);
    if (!t) { $('ptPratinjau').innerHTML = ''; return; }
    $('ptPratinjau').innerHTML = '<p class="redup">' + esc(t.customer) + ' · ' + t.invoice.length + ' invoice LOCKED akan diperpanjang' + (hari > 0 ? ' ' + hari + ' hari' : '') + ':</p>' +
      tabel(['No Inv', 'Tempo lama', 'Tempo baru'], t.invoice.map(function (i) { return { sel: [esc(i.noInv), esc(i.tempo), hari > 0 && i.tempoIso ? '<b>' + tglTambah(i.tempoIso, hari) + '</b>' : '-'] }; }));
  }
  function muatTempoToko(pilih) {
    if (pilih) PT.pilih = pilih;
    api('tempoTokoDaftar', {}, 'Menghitung status toko…').then(function (d) {
      PT.toko = d.toko.filter(function (t) { return t.status === 'LOCKED'; });
      const lain = d.toko.filter(function (t) { return t.status !== 'LOCKED' && t.status !== 'UNLOCKED'; });
      $('ptToko').innerHTML = '<option value="">— pilih toko LOCKED —</option>' + PT.toko.map(function (t) { return '<option>' + esc(t.customer) + '</option>'; }).join('');
      if (PT.pilih) { $('ptToko').value = PT.pilih; PT.pilih = ''; }
      $('ptDaftar').innerHTML = (PT.toko.length ? '' : '<div class="sukses">Tidak ada toko LOCKED saat ini.</div>') +
        (lain.length ? '<p class="redup">Mendekati batas (masih bisa SJ): ' + lain.map(function (t) { return esc(t.customer) + ' ' + lencanaStatus(t.status); }).join(' · ') + '</p>' : '');
      gambarPratinjauTempo();
    }).catch(gagal);
  }
  $('ptMuat').onclick = function () { muatTempoToko($('ptToko').value); };
  $('ptToko').onchange = gambarPratinjauTempo;
  $('ptHari').oninput = gambarPratinjauTempo;
  $('ptSimpan').onclick = function () {
    const toko = $('ptToko').value, hari = parseInt($('ptHari').value, 10);
    if (!toko) { toast('Pilih toko dulu.'); return; }
    if (!(hari > 0)) { toast('Isi jumlah hari (angka lebih dari 0).'); return; }
    if (!$('ptPass').value) { toast('Isi password perpanjangan tempo.'); return; }
    konfirmasi('Perpanjang tempo', '<p>Perpanjang tempo <b>' + esc(toko) + '</b> <b>' + hari + ' hari</b> untuk semua invoice LOCKED-nya?</p>', 'Ya, perpanjang').then(function (ya) {
      if (!ya) return;
      api('perpanjangTempo', { customer: toko, jumlahHari: hari, password: $('ptPass').value }, 'Memperpanjang tempo…').then(function (h) {
        $('ptPass').value = ''; $('ptHari').value = '';
        bukaModal((S.latihan ? '🧪 (latihan) ' : '✅ ') + 'Tempo diperpanjang', '<div class="sukses">Tempo diperpanjang <b>' + h.jumlahHari + ' hari</b> untuk <b>' + h.jumlah + '</b> invoice LOCKED milik <b>' + esc(h.customer) + '</b>.' + (h.statusBaru ? ' Status toko sekarang: ' + lencanaStatus(h.statusBaru) : '') + '</div>' +
          tabel(['No Inv', 'Tempo lama', 'Tempo baru'], h.rows.map(function (r) { return { sel: [esc(r.noInv), esc(r.tempoLama), '<b>' + esc(r.tempoBaru) + '</b>'] }; })) +
          ((h.catatan || []).length ? '<div class="peringatan">' + esc(h.catatan.join(' · ')) + '</div>' : '') +
          '<div class="aksi-bawah"><button class="tombol utama" id="ptOk">OK</button></div>');
        $('ptOk').onclick = tutupModal;
        muatTempoToko();
      }).catch(function (e) { $('ptPass').value = ''; gagal(e); });
    });
  };
  $('btSimpan').onclick = function () {
    api('batalTercetak', { noInv: $('btNoInv').value, alasan: $('btAlasan').value }, 'Membatalkan…').then(function (h) { toast(h.pesan); $('btNoInv').value = ''; $('btAlasan').value = ''; }).catch(gagal);
  };
  $('susCari').onclick = function () {
    api('susulanKandidat', { bulan: $('susBulan').value }, 'Mencari invoice…').then(function (d) {
      $('susHasil').innerHTML = (d.kandidat.length ? tabel(['No Inv', 'Tanggal', 'Customer', 'Total'], d.kandidat.map(function (k) { return { sel: [esc(k.noInv), esc(k.tglInvoice), esc(k.customer), rp(k.total)] }; }), [3]) +
        '<div class="aksi-bawah"><button class="tombol utama" id="susSimpan" type="button">Catat ' + d.kandidat.length + ' invoice sebagai TERCETAK</button></div>' : '<div class="kosong">Tidak ada invoice yang perlu dicatat.</div>') +
        (d.dilewati ? '<p class="redup">' + d.dilewati + ' invoice sudah ada di log.</p>' : '');
      if ($('susSimpan')) $('susSimpan').onclick = function () {
        api('susulanSimpan', { bulan: d.bulan }, 'Mencatat…').then(function (h) {
          $('susHasil').innerHTML = '<div class="sukses">' + h.berhasil.length + ' invoice dicatat TERCETAK.</div>' + (h.gagal.length ? '<div class="gagal">' + esc(h.gagal.join(', ')) + '</div>' : '') + (h.berhenti ? '<div class="peringatan">Berhenti karena batas waktu, jalankan lagi untuk sisanya.</div>' : '');
        }).catch(gagal);
      };
    }).catch(gagal);
  };
  $('usCari').onclick = function () {
    api('statusSJ', { noSJ: $('usNoSJ').value }, 'Mencari…').then(function (d) {
      const pilihT = ['PROGRESS', 'REVISI', 'DONE'], pilihD = ['PO', 'DONE'];
      $('usHasil').innerHTML = '<p><b>' + esc(d.noSJ) + '</b> / ' + esc(d.noInv) + ' · ' + esc(d.customer) + '</p>' +
        '<div class="filter"><label>Status TRANSAKSI (sekarang: ' + esc(d.status || '-') + ')<select id="usStatusT">' + pilihT.map(function (x) { return '<option' + (x === d.status ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select></label><button class="tombol" id="usSimpanT" type="button">Ubah</button></div>' +
        tabel(['Baris', 'Kode', 'Barang', 'Qty', 'Status', ''], d.items.map(function (it, i) {
          return { sel: [esc(it.baris), esc(it.kode), esc(it.barang), esc(it.qty), lencanaStatus(it.status), '<select class="usD" data-i="' + i + '">' + pilihD.map(function (x) { return '<option' + (x === it.status ? ' selected' : '') + '>' + x + '</option>'; }).join('') + '</select> <button class="tombol kecil usSimpanD" data-i="' + i + '" type="button">Ubah</button>'] };
        }));
      $('usSimpanT').onclick = function () { api('ubahStatus', { sheet: 'TRANSAKSI', noSJ: d.noSJ, status: $('usStatusT').value }, 'Mengubah…').then(function (h) { toast(h.pesan); $('usCari').click(); }).catch(gagal); };
      document.querySelectorAll('.usSimpanD').forEach(function (b) {
        b.onclick = function () { const it = d.items[Number(b.dataset.i)]; api('ubahStatus', { sheet: 'DETAIL_TRANSAKSI', noSJ: d.noSJ, baris: it.baris, kode: it.kode, status: document.querySelector('.usD[data-i="' + b.dataset.i + '"]').value }, 'Mengubah…').then(function (h) { toast(h.pesan); $('usCari').click(); }).catch(gagal); };
      });
    }).catch(gagal);
  };
  $('grMuat').onclick = function () {
    api('groupingDaftar', {}, 'Memuat SJ beli…').then(function (list) {
      $('grDaftar').innerHTML = tabel(['', 'No PB', 'No SJ', 'Supplier', 'Tgl beli', 'Total'], list.map(function (x) {
        return { sel: ['<input type="checkbox" class="grCek" value="' + x.rowIndex + '" style="width:auto">', esc(x.noPB), esc(x.noSJ), esc(x.supplier), esc(tglTampil(String(x.tglBeli).slice(0, 10)) || x.tglBeli), rp(x.total)] };
      }), [5]);
    }).catch(gagal);
  };
  $('grSimpan').onclick = function () {
    const rows = []; document.querySelectorAll('.grCek').forEach(function (c) { if (c.checked) rows.push(Number(c.value)); });
    if (!rows.length) { toast('Centang SJ beli dulu.'); return; }
    api('groupingSimpan', { noInv: $('grNoInv').value, jatuhTempo: $('grTempo').value, transaksiBulan: $('grBulan').value, rows: rows }, 'Menyimpan grouping…').then(function () { toast(rows.length + ' SJ beli di-grouping'); $('grMuat').click(); }).catch(gagal);
  };

  /* ---------- mode latihan ---------- */
  function siapkanLatihan(segarkan) {
    return api('siapkanLatihan', { segarkan: !!segarkan }, segarkan ? 'Menyalin ulang database ke file latihan… (bisa sampai 1 menit)' : 'Menyiapkan file latihan… (pertama kali bisa sampai 1 menit)').then(function (h) {
      S.latihanSiap = true; $('latihanWaktu').textContent = h.waktu; return h;
    });
  }
  $('latihanSegarkan').onclick = function () {
    konfirmasi('Segarkan data latihan', '<p>File latihan dibuat ulang dari database asli saat ini. Semua data latihan sebelumnya hilang (data asli tidak tersentuh).</p>', 'Ya, segarkan').then(function (ya) {
      if (ya) siapkanLatihan(true).then(function () { toast('Data latihan sudah sama dengan data asli terbaru.'); if (S.hal) pergi(S.hal); }).catch(gagal);
    });
  };
  function setLatihan(on) {
    S.latihan = !!on && (!K.fitur || K.fitur.indexOf('latihan') !== -1); $('modeLatihan').checked = S.latihan;
    S.latihanSiap = false;
    document.body.classList.toggle('latihan', S.latihan);
    $('bannerLatihan').classList.toggle('tersembunyi', !S.latihan);
    $('akunMode').textContent = S.latihan ? '🧪 Mode latihan' : 'Data asli'; $('akunMode').classList.toggle('latihan', S.latihan);
    simpan('sfLatihan', S.latihan ? '1' : null);
  }
  $('modeLatihan').addEventListener('change', function () { setLatihan(this.checked); toast(S.latihan ? 'Mode latihan AKTIF: simpan & cetak memakai file latihan' : 'Mode latihan dimatikan: simpan sungguhan'); if (S.latihan && S.token) siapkanLatihan(false).then(function () { if (S.hal) pergi(S.hal); }).catch(gagal); else if (S.hal && S.token) pergi(S.hal); });
  setLatihan(ambil('sfLatihan') === '1');

  /* ---------- cetak PDF (nota sama dengan inventory) ---------- */
  // PDF tidak disimpan ke Drive: diterima sebagai data lalu diunduh ke komputer (folder Unduhan)
  function unduhPdf(nama, b64) {
    const bin = atob(b64), arr = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([arr], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = nama; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
  }
  function cetakPdf(jenis, nomor, tandai, alasan) {
    return api('cetak', { jenis: jenis, nomor: nomor, tandaiCetak: !!tandai, alasan: alasan || '' }, 'Membuat PDF dari template inventory…').then(function (h) {
      unduhPdf(h.nama, h.pdf);
      bukaModal('🖨️ ' + h.nama, (h.tercetak ? '<div class="' + (S.latihan ? 'peringatan' : 'sukses') + '">' + esc(h.tercetak) + '</div>' : '') +
        '<p>PDF sudah diunduh ke komputer ini (folder Unduhan / Downloads). Buka file-nya lalu print. File tidak disimpan di Google Drive.</p>' +
        '<div class="aksi-bawah"><button class="tombol" id="cUnduhLagi" type="button">⬇️ Unduh lagi</button><button class="tombol utama" id="cTutupPdf" type="button">Selesai</button></div>');
      $('cUnduhLagi').onclick = function () { unduhPdf(h.nama, h.pdf); };
      $('cTutupPdf').onclick = tutupModal;
    }).catch(function (err) {
      // invoice yang sudah pernah ditandai tercetak: alasan cetak ulang wajib (sama dengan menu SIAP CETAK)
      if (/alasan cetak ulang/i.test(err.message)) {
        bukaModal('Cetak ulang ' + nomor, '<div class="peringatan">' + esc(err.message) + '</div><label>Alasan cetak ulang<input id="cAlasan" placeholder="mis. kertas rusak, revisi harga"></label>' +
          '<div class="aksi-bawah"><button class="tombol" id="cAlasanBatal">Batal</button><button class="tombol" id="cTanpaTanda">Cetak tanpa ditandai</button><button class="tombol utama" id="cAlasanOk">Cetak ulang</button></div>');
        $('cAlasanBatal').onclick = tutupModal;
        $('cTanpaTanda').onclick = function () { tutupModal(); cetakPdf(jenis, nomor, false); };
        $('cAlasanOk').onclick = function () { const al = $('cAlasan').value.trim(); if (!al) { toast('Isi alasannya.'); return; } tutupModal(); cetakPdf(jenis, nomor, true, al); };
        return;
      }
      gagal(err);
    });
  }
  document.addEventListener('click', function (e) {
    const t = e.target.closest('[data-cetak]'); if (!t) return;
    cetakPdf(t.dataset.cetak, t.dataset.nomor, t.dataset.tandai === '1');
  });
  function tombolCetak(jenis, nomor, label, tandai) {
    return '<button class="tombol" type="button" data-cetak="' + esc(jenis) + '" data-nomor="' + esc(nomor) + '" data-tandai="' + (tandai ? '1' : '') + '">' + esc(label) + '</button>';
  }

  /* ---------- mulai ---------- */
  S.token = ambil('sfToken'); S.nama = ambil('sfNama') || '';
  if (S.token) masuk();
})();
</script>
