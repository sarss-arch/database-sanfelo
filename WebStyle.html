<style>
  :root {
    /* warna mengikuti logo: coklat kayu, abu arang, krem -- dominan putih */
    --bg: #fbfaf8; --panel: #ffffff; --teks: #2b2622; --redup: #7d7268; --garis: #eee7de;
    --hijau: #8b5e3c; --hijau-tua: #6b4429; --hijau-muda: #f5ede4; --biru: #4a4a4f;
    --ok: #4f7a52; --ok-muda: #e8f1e6;
    --merah: #b4473b; --merah-muda: #f9e9e6; --kuning: #a8742a; --kuning-muda: #fbf2e2;
    --gelap: #3f3f42; --bayang: 0 1px 2px rgba(60,40,25,.04), 0 6px 24px rgba(60,40,25,.06);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--teks); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; }
  h1, h2, h3, h4 { margin: 0; letter-spacing: -.01em; }
  a { color: var(--hijau); cursor: pointer; font-weight: 600; text-decoration: none; }
  .tersembunyi { display: none !important; }
  .redup { color: var(--redup); }
  input, select, textarea { font: inherit; color: inherit; width: 100%; padding: 10px 12px; border: 1px solid var(--garis); border-radius: 12px; background: #fff; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--hijau); box-shadow: 0 0 0 3px rgba(139,94,60,.15); }
  label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 700; color: var(--redup); }
  .tombol { font: inherit; font-weight: 700; border: 1px solid var(--garis); background: #fff; color: var(--teks); padding: 10px 16px; border-radius: 12px; cursor: pointer; white-space: nowrap; }
  .tombol:hover { border-color: var(--hijau); }
  .tombol:disabled { opacity: .5; cursor: not-allowed; }
  .tombol.utama { background: linear-gradient(135deg, #a0714c, var(--hijau-tua)); color: #fff; border: none; }
  .tombol.gelap { background: var(--gelap); color: #fff; border: none; }
  .tombol.putih { background: #fff; border: 1px solid #e3d5c5; color: var(--hijau-tua); }
  .tombol.bahaya { background: var(--merah); color: #fff; border: none; }
  .tombol.kecil { padding: 6px 10px; font-size: 12px; }
  .tombol.ikon { padding: 8px 11px; }
  .tombol.lebar { width: 100%; }

  /* login */
  .layar-login { min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(circle at 20% 10%, #f1e6d8, transparent 45%), var(--bg); }
  .kartu-login { width: 100%; max-width: 360px; background: #fff; border-radius: 22px; padding: 28px; box-shadow: var(--bayang); display: flex; flex-direction: column; gap: 14px; }
  .kartu-login h1 { font-size: 22px; }
  .logo-full { width: 150px; height: 150px; border-radius: 18px; align-self: center; }
  .logo { width: 48px; height: 48px; border-radius: 14px; border: 1px solid var(--garis); }
  .pesan-error { color: var(--merah); font-size: 13px; min-height: 18px; }

  /* kerangka */
  .aplikasi { display: grid; grid-template-columns: 250px 1fr; min-height: 100vh; }
  .sidebar { background: #fff; border-right: 1px solid var(--garis); padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
  .merek { display: flex; gap: 10px; align-items: center; }
  .merek .logo { width: 44px; height: 44px; border-radius: 12px; }
  .merek small { display: block; color: var(--redup); font-size: 11px; }
  /* menu samping bisa digulir sendiri kalau layar pendek (laptop kecil / zoom besar) */
  .sidebar { height: 100dvh; max-height: 100vh; overflow: hidden; }
  nav { display: flex; flex-direction: column; gap: 2px; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; margin-right: -8px; padding-right: 8px; scrollbar-width: thin; scrollbar-color: #c9d3ce transparent; }
  nav::-webkit-scrollbar { width: 8px; }
  nav::-webkit-scrollbar-thumb { background: #c9d3ce; border-radius: 8px; }
  nav::-webkit-scrollbar-track { background: transparent; }
  .sidebar > .merek { flex-shrink: 0; }
  .nav-judul { font-size: 10px; font-weight: 800; letter-spacing: .12em; color: #9aaba3; margin: 14px 10px 6px; text-transform: uppercase; }
  nav a { color: var(--teks); font-weight: 600; padding: 10px 12px; border-radius: 12px; display: flex; gap: 10px; align-items: center; }
  nav a:hover { background: var(--hijau-muda); }
  nav a.aktif { background: var(--hijau-muda); color: var(--hijau-tua); box-shadow: inset 3px 0 0 var(--hijau); }
  .ik { width: 20px; text-align: center; color: var(--hijau); }

  .utama-isi { padding: 20px 28px 40px; min-width: 0; }
  .kepala { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; }
  .kepala h2 { font-size: 24px; }
  .alis { font-size: 10px; font-weight: 800; letter-spacing: .14em; color: var(--hijau); }
  .alis.terang { color: var(--hijau); }
  .kepala-kanan { margin-left: auto; display: flex; gap: 10px; align-items: center; }
  .chip-tgl, .chip-admin { background: #fff; border: 1px solid var(--garis); border-radius: 14px; padding: 8px 12px; display: flex; flex-direction: column; font-size: 12px; }
  .chip-tgl small { color: var(--redup); font-size: 10px; }
  .chip-admin { flex-direction: row; align-items: center; gap: 10px; font-weight: 700; }
  @media (max-width: 700px) { .teks-segar { display: none; } .chip-admin { gap: 6px; } }
  .menu-hp { display: none; }
  .chip-latihan { flex-direction: row; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--garis); border-radius: 14px; padding: 8px 12px; font-size: 12px; color: var(--teks); cursor: pointer; }
  .chip-latihan input { width: auto; }
  .banner-latihan { background: #fff4d6; border: 1px dashed #d9a520; color: #7a5312; border-radius: 14px; padding: 10px 14px; font-weight: 700; margin-bottom: 14px; }
  body.latihan .kepala { background: repeating-linear-gradient(135deg, #fffaf0, #fffaf0 12px, #fff4d6 12px, #fff4d6 24px); border-radius: 16px; padding: 6px 10px; }

  .hero { border-radius: 22px; padding: 22px 26px; color: var(--teks); background: linear-gradient(120deg, #fff 35%, #f5ede4); border: 1px solid var(--garis); display: flex; gap: 18px; align-items: center; box-shadow: var(--bayang); margin-bottom: 18px; }
  .hero-logo { width: 84px; height: 84px; border-radius: 18px; flex: none; }
  .hero-teks { flex: 1; }
  .hero h3 { font-size: 26px; margin: 6px 0; }
  .hero p { margin: 0; color: var(--redup); }
  .hero-aksi { display: flex; flex-direction: column; gap: 8px; }

  .kartu { background: var(--panel); border-radius: var(--radius); box-shadow: var(--bayang); padding: 18px; margin-bottom: 16px; border: 1px solid #eef3f0; min-width: 0; }
  .kartu-kepala { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .kartu h4 { font-size: 15px; }
  .grid-stat { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
  .stat { background: #fff; border-radius: var(--radius); padding: 16px; box-shadow: var(--bayang); border: 1px solid #eef3f0; }
  .stat .label { font-size: 12px; font-weight: 700; color: var(--redup); display: flex; gap: 8px; align-items: center; }
  .stat .label i { font-style: normal; width: 28px; height: 28px; border-radius: 9px; display: grid; place-items: center; }
  .stat .nilai { font-size: 22px; font-weight: 800; margin: 10px 0 2px; }
  .stat small { color: var(--redup); }
  .grid-dua { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .filter { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; }
  .filter .isi { flex: 1; min-width: 200px; }
  .pemisah { width: 1px; align-self: stretch; background: var(--garis); }
  .ringkas { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .ringkas .pil { background: #fff; border: 1px solid var(--garis); border-radius: 12px; padding: 8px 12px; }

  .tabel-bungkus { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--redup); padding: 10px; border-bottom: 1px solid var(--garis); white-space: nowrap; background: #fbf8f4; position: sticky; top: 0; }
  td { padding: 10px; border-bottom: 1px solid #f0f4f2; vertical-align: top; }
  td { white-space: nowrap; }
  td .panjang { white-space: normal; display: inline-block; min-width: 220px; }
  tr.klik { cursor: pointer; }
  tr.klik:hover td { background: #fbf6f0; }
  .kanan { text-align: right; white-space: nowrap; }
  .lencana { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 800; background: #eef2f0; color: var(--redup); white-space: nowrap; }
  .lencana.hijau { background: var(--ok-muda); color: var(--ok); }
  .lencana.merah { background: var(--merah-muda); color: var(--merah); }
  .lencana.kuning { background: var(--kuning-muda); color: var(--kuning); }
  .kosong { text-align: center; color: var(--redup); padding: 24px; }
  .baris-daftar { display: flex; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f4f2; }
  .baris-daftar:last-child { border-bottom: none; }
  .baris-daftar small { display: block; color: var(--redup); }

  .tab-data { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .tab-data button { font: inherit; font-weight: 700; font-size: 12px; border: 1px solid var(--garis); background: #fff; border-radius: 999px; padding: 7px 12px; cursor: pointer; }
  .tab-data button.aktif { background: var(--gelap); color: #fff; border-color: var(--gelap); }
  .halaman { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 12px; }

  .grid-info { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .info { background: #faf6f1; border-radius: 12px; padding: 10px 12px; }
  .info small { display: block; color: var(--redup); font-size: 11px; font-weight: 700; }
  .info b { font-size: 15px; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
  .form-grid .penuh { grid-column: 1 / -1; }
  .form-grid.tiga { grid-template-columns: repeat(3, 1fr); }
  .form-grid .penuh-2 { grid-column: span 2; }
  .baris-input { display: flex; gap: 8px; }
  #poBaris input { padding: 7px 9px; }
  #poBaris .kode { width: 150px; } #poBaris .qty { width: 70px; text-align: right; }
  .peringatan { background: var(--kuning-muda); color: #7a5312; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 8px 0; }
  .sukses { background: var(--ok-muda); color: var(--ok); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 8px 0; }
  .gagal { background: var(--merah-muda); color: var(--merah); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 8px 0; }
  .aksi-bawah { display: flex; gap: 10px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .pb-baris td input { width: 140px; padding: 7px 9px; text-align: right; }

  .latar-modal { position: fixed; inset: 0; background: rgba(15,27,45,.45); display: grid; place-items: center; padding: 16px; z-index: 50; }
  .modal { background: #fff; border-radius: 20px; width: 100%; max-width: 640px; max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
  .modal-kepala { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--garis); }
  .modal-isi { padding: 16px 20px 20px; overflow-y: auto; }
  /* penanda memuat: pil kecil di pojok kanan bawah, tidak menutup layar (halaman tetap bisa diklik) */
  .memuat { position: fixed; right: 20px; bottom: 20px; z-index: 60; display: flex; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--garis); border-radius: 999px; padding: 8px 16px 8px 10px; box-shadow: 0 6px 20px rgba(20,40,30,.12); pointer-events: none; max-width: calc(100vw - 32px); }
  .memuat .putar { width: 18px; height: 18px; border-width: 3px; flex: none; }
  .memuat span { font-weight: 700; font-size: 13px; color: var(--redup); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* halaman yang sedang menyimpan: dikunci sebentar (menu lain tetap bisa dibuka) */
  .hal.sibuk { opacity: .6; pointer-events: none; }
  .putar { width: 36px; height: 36px; border-radius: 50%; border: 4px solid var(--hijau-muda); border-top-color: var(--hijau); animation: putar 0.8s linear infinite; }
  @keyframes putar { to { transform: rotate(360deg); } }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--gelap); color: #fff; padding: 12px 18px; border-radius: 14px; font-weight: 600; transition: transform .25s; z-index: 70; max-width: 90vw; }
  .toast.tampil { transform: translateX(-50%) translateY(0); }

  .invoice-kertas { background: #fff; }
  .invoice-kop { display: flex; justify-content: space-between; gap: 16px; margin-bottom: 14px; flex-wrap: wrap; }
  .invoice-kop h3 { font-size: 20px; }
  .total-baris { display: flex; justify-content: flex-end; gap: 30px; font-size: 15px; padding: 10px; }

  @media (max-width: 1000px) {
    .grid-stat { grid-template-columns: repeat(2, 1fr); }
    .grid-dua { grid-template-columns: 1fr; }
  }
  @media (max-width: 760px) {
    .aplikasi { grid-template-columns: 1fr; }
    .sidebar { position: fixed; left: 0; top: 0; width: 260px; z-index: 40; transform: translateX(-100%); transition: transform .2s; box-shadow: 0 0 40px rgba(0,0,0,.2); }
    .sidebar.buka { transform: translateX(0); }
    .menu-hp { display: inline-block; }
    .utama-isi { padding: 14px 16px 40px; }
    .chip-tgl { display: none; }
    .hero { flex-direction: column; align-items: flex-start; }
    .hero-logo { width: 64px; height: 64px; }
    .hero-aksi { flex-direction: row; flex-wrap: wrap; }
    .grid-stat { grid-template-columns: 1fr; }
    .grid-info, .form-grid, .form-grid.tiga { grid-template-columns: 1fr; }
    .form-grid .penuh-2 { grid-column: auto; }
    .baris-input { flex-direction: column; }
    .pemisah { display: none; }
  }
  @media print {
    .sidebar, .kepala, .tanpa-cetak, .toast, .memuat { display: none !important; }
    .aplikasi { display: block; }
    .utama-isi { padding: 0; }
    .kartu { box-shadow: none; border: none; }
    body { background: #fff; }
  }

  /* ===== tampilan baru (Nov 2026) ===== */
  /* login: pilih nama */
  .pilih-nama { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 12px; }
  .pilih-nama button { flex: 1; min-width: 90px; padding: 12px 10px; border-radius: 14px; border: 1px solid var(--garis); background: #fff; font: inherit; font-weight: 700; cursor: pointer; color: var(--teks); }
  .pilih-nama button.aktif { background: var(--hijau-muda); border-color: var(--hijau); color: var(--hijau-tua); box-shadow: inset 0 0 0 1px var(--hijau); }
  .cek-kecil { display: flex !important; flex-direction: row !important; align-items: center; gap: 6px; font-size: 12px !important; font-weight: 600; color: var(--redup); margin: 2px 0 6px; cursor: pointer; }
  .cek-kecil input { width: 14px !important; height: 14px; margin: 0; padding: 0; }
  .cek-kecil.tersembunyi { display: none !important; }
  /* sidebar: panel akun menempel di bawah */
  .panel-akun { flex-shrink: 0; border-top: 1px solid var(--garis); padding-top: 12px; display: flex; flex-direction: column; gap: 6px; }
  .akun-baris { display: flex; gap: 10px; align-items: center; }
  .akun-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--gelap); color: #fff; display: grid; place-items: center; font-weight: 800; font-size: 13px; flex: none; }
  .akun-info b { display: block; font-size: 14px; }
  .akun-info small { color: var(--redup); font-size: 11px; }
  .akun-info small.latihan { color: #a8742a; font-weight: 700; }
  .akun-tgl { font-size: 11px; color: var(--redup); }
  .akun-tgl b { color: var(--teks); }
  .akun-tombol { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .akun-tombol .tombol { justify-content: center; }
  .kepala-kanan:empty { display: none; }
  /* dashboard: ringkasan PO di kotak sapaan */
  .hero { flex-wrap: wrap; }
  .hero-teks { flex: 1 1 260px; min-width: 240px; }
  .hero-po { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1 1 360px; max-width: 520px; }
  .hero-po .po-kotak { background: #fff; border: 1px solid var(--garis); border-radius: 16px; padding: 12px 14px; cursor: pointer; text-align: left; font: inherit; color: var(--teks); }
  .hero-po .po-kotak:hover { border-color: var(--hijau); }
  .hero-po .po-kotak small { display: block; color: var(--redup); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .hero-po .po-kotak b { display: block; font-size: 22px; margin: 2px 0; }
  .hero-po .po-kotak span { font-size: 12px; color: var(--redup); }
  /* garis loading berjalan */
  .garis-muat { position: fixed; top: 0; left: 0; right: 0; height: 3px; z-index: 80; overflow: hidden; background: var(--hijau-muda); }
  .garis-muat span { position: absolute; top: 0; bottom: 0; width: 35%; background: var(--hijau); border-radius: 3px; animation: garisJalan 1.1s ease-in-out infinite; }
  @keyframes garisJalan { 0% { left: -35%; } 100% { left: 100%; } }
  /* daftar nota */
  .daftar-kepala { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .daftar-kepala .cari { flex: 1; min-width: 220px; }
  .daftar-kepala select { width: auto; min-width: 160px; }
  .rekap { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  .rekap span { background: var(--hijau-muda); border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--hijau-tua); white-space: nowrap; }
  .rekap span b { color: var(--teks); }
  .tombol-mata { border: 1px solid var(--garis); background: #fff; border-radius: 8px; width: 30px; height: 28px; cursor: pointer; color: var(--redup); display: inline-grid; place-items: center; padding: 0; }
  .tombol-mata:hover { border-color: var(--hijau); color: var(--hijau-tua); background: var(--hijau-muda); }
  /* PO keluar: format sama dengan form PO_KELUAR di spreadsheet */
  .kertas-pok { font-family: 'Poppins', 'Plus Jakarta Sans', sans-serif; }
  .pok-kepala { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 12px; }
  .pok-logo { width: 96px; height: 96px; background-size: contain !important; background-repeat: no-repeat !important; background-position: center !important; background-color: transparent !important; }
  .pok-judul { text-align: right; }
  .pok-judul b { display: block; font-size: 22px; letter-spacing: .01em; }
  .pok-judul i { display: block; font-size: 13px; margin-top: 8px; }
  .pok-info { display: flex; justify-content: space-between; margin: 16px 6px 12px; font-size: 13px; }
  .kertas-pok table th, .kertas-pok table td { border-color: #333; font-size: 12px; }
  .kertas-pok table th { background: #fff; font-size: 12px; }
  .kertas .tengah { text-align: center; }
  .lebih-banyak { text-align: center; margin-top: 10px; }
  .tabel-daftar td { white-space: nowrap; }
  .tabel-daftar .panjang { display: inline-block; max-width: 260px; overflow: hidden; text-overflow: ellipsis; vertical-align: bottom; white-space: nowrap; }
  /* detail nota (seperti Laurence) */
  .nota-ringkas { display: flex; gap: 26px; flex-wrap: wrap; align-items: flex-start; }
  .nota-ringkas > div small { display: block; font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--redup); text-transform: uppercase; }
  .nota-ringkas > div b { font-size: 16px; }
  .nota-ringkas .nota-cetak { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid-nota { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .label-nota { font-size: 11px; font-weight: 800; letter-spacing: .08em; color: var(--redup); margin: 4px 0 6px; }
  .kertas { background: #fff; border: 1px solid var(--garis); border-radius: 6px; padding: 20px 18px 24px; font-size: 12px; box-shadow: var(--bayang); }
  .kertas h5 { text-align: center; letter-spacing: .14em; font-size: 15px; margin: 0 0 14px; }
  .kertas .kertas-kepala { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .kertas .kertas-kepala .kanan { text-align: right; }
  .kertas table { width: 100%; border-collapse: collapse; }
  .kertas th, .kertas td { border: 1px solid #d9d2c8; padding: 5px 7px; font-size: 12px; }
  .kertas th { background: #f4f1ec; text-align: left; font-size: 11px; }
  .kertas td.kanan, .kertas th.kanan { text-align: right; }
  .kertas .ttd { display: flex; justify-content: space-between; margin-top: 22px; color: var(--redup); }
